  sync_success_value: success
  schema: public
subscriptions:
  schema_migration:
    stage: A
    diff_threshold_pct: 15
  keyword_recall_mode: or
  intent_profiles:
    - tag: agent-memory
      description: 帮我查找agent memory相关论文
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: agent memory
          keyword_cn: 智能体记忆
          query: memory mechanisms and memory systems for autonomous agents
        - keyword: long-term memory
          keyword_cn: 长期记忆
          query: long-term memory storage and retrieval in agent systems
        - keyword: conversational memory
          keyword_cn: 对话记忆
          query: conversational memory for dialogue agents
        - keyword: memory architecture
          keyword_cn: 记忆架构
          query: memory architecture designs for intelligent agents
        - keyword: working memory
          keyword_cn: 工作记忆
          query: working memory mechanisms for agent reasoning
        - keyword: memory-augmented agents
          keyword_cn: 记忆增强智能体
          query: agents augmented with external and persistent memory
      intent_queries:
        - query: papers on memory mechanisms for autonomous agents
          query_cn: 关于自主智能体记忆机制的论文
          enabled: true
          source: manual
          note: ''
        - query: how agents store retrieve and update long term memory
          query_cn: 智能体如何存储、检索和更新长期记忆
          enabled: true
          source: manual
          note: ''
        - query: memory architectures for conversational agents and multi agent systems
          query_cn: 对话智能体和多智能体系统的记忆架构
          enabled: true
          source: manual
          note: ''
        - query: methods for memory consolidation and retrieval in agent systems
          query_cn: 智能体系统中的记忆巩固与检索方法
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-10-22T12:42:59.810Z'
    - tag: rag-papers
      description: 请帮我查找RAG相关的论文
      enabled: true
      paper_sources:
        - arxiv
        - biorxiv
      keywords:
        - keyword: retrieval augmented generation
          keyword_cn: 检索增强生成
          query: research papers on retrieval-augmented generation for large language models
        - keyword: knowledge retrieval
          keyword_cn: 知识检索
          query: knowledge retrieval approaches for grounding language model outputs
        - keyword: retrieval augmentation
          keyword_cn: 检索增强
          query: retrieval augmentation strategies for language model pipelines
        - keyword: hallucination mitigation
          keyword_cn: 幻觉缓解
          query: hallucination mitigation using retrieved external knowledge
      intent_queries:
        - query: Find research papers about retrieval augmented generation for large language models.
          query_cn: 查找关于大语言模型检索增强生成的研究论文。
          enabled: true
          source: manual
          note: ''
        - query: Search for papers on retrieval methods and evidence grounding in language model question answering.
          query_cn: 搜索关于语言模型问答中的检索方法和证据支撑的论文。
          enabled: true
          source: manual
          note: ''
        - query: Locate academic papers that evaluate retrieval augmented generation systems.
          query_cn: 查找评估检索增强生成系统的学术论文。
          enabled: true
          source: manual
          note: ''
        - query: Find papers about reducing hallucinations with external knowledge retrieval.
          query_cn: 查找通过外部知识检索减少幻觉的论文。
          enabled: true
          source: manual
          note: ''
      updated_at: '2026-10-22T12:45:09.263Z'
